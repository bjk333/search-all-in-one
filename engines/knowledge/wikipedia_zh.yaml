id: wikipedia_zh
domain: knowledge
tier: L0
protocol: http_json
description: "中文维基百科公开搜索 API（免 Key，中文概念与百科条目）"
rate_limit:
  rpm: 120
  deadline_sec: 10
request:
  method: GET
  url: "https://zh.wikipedia.org/w/api.php"
  params:
    action: "query"
    list: "search"
    srsearch: "{query}"
    srlimit: "{limit}"
    format: "json"
    utf8: "1"
response:
  items_path: "query.search"
  url_template: "https://zh.wikipedia.org/wiki/{title}"
  output_map:
    id: "pageid"
    title: "title"
    snippet: "snippet | strip_html | collapse_ws"
    published_at: "timestamp"
