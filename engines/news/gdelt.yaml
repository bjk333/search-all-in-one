id: gdelt
domain: news
tier: L0
protocol: http_json
description: "GDELT 2.0 全球实时新闻公开检索（免 Key）"
rate_limit:
  rpm: 60
  deadline_sec: 12
request:
  method: GET
  url: "https://api.gdeltproject.org/api/v2/doc/doc"
  params:
    query: "{query}"
    mode: "artlist"
    format: "json"
    maxrecords: "{limit}"
response:
  items_path: "articles"
  output_map:
    id: "url"
    title: "title"
    url: "url"
    snippet: "domain"
    published_at: "seendate"
