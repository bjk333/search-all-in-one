id: packagist
domain: packages
tier: L0
protocol: http_json
description: "Packagist (PHP Composer) 官方包搜索 API"
rate_limit:
  rpm: 60
  deadline_sec: 10.0
request:
  method: GET
  url: "https://packagist.org/search.json"
  params:
    q: "{query}"
    per_page: "{limit}"
response:
  items_path: "results"
  modality: "code"
  output_map:
    id: "name"
    title: "name"
    url: "url || repository"
    snippet: "description | collapse_ws"
    popularity: "downloads"
    popularity_unit: "'downloads'"
