id: nuget
domain: packages
tier: L0
protocol: http_json
description: "NuGet (.NET) 官方包搜索 API"
rate_limit:
  rpm: 60
  deadline_sec: 10.0
request:
  method: GET
  url: "https://azuresearch-usnc.nuget.org/query"
  params:
    q: "{query}"
    take: "{limit}"
response:
  items_path: "data"
  url_template: "https://www.nuget.org/packages/{id}"
  modality: "code"
  output_map:
    id: "id"
    title: "title || id"
    url: "projectUrl"
    snippet: "description || summary | collapse_ws"
    popularity: "totalDownloads"
    popularity_unit: "'downloads'"
