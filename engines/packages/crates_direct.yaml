id: crates_direct
domain: packages
tier: L0
protocol: http_json
description: "crates.io Rust 官方包仓库直连 API（免 Key）"
rate_limit:
  rpm: 30
  deadline_sec: 10.0
request:
  method: GET
  url: "https://crates.io/api/v1/crates"
  headers:
    User-Agent: "omni-search/0.2 (+https://github.com/omni-search)"
  params:
    q: "{query}"
    per_page: "{limit}"
response:
  items_path: "crates"
  url_template: "https://crates.io/crates/{id}"
  modality: "code"
  output_map:
    id: "id"
    title: "name"
    url: "repository || homepage || documentation"
    snippet: "description | collapse_ws"
    published_at: "updated_at"
    popularity: "downloads"
    popularity_unit: "'downloads'"
