id: mcp_registry
domain: packages
tier: L0
protocol: http_json
description: "官方 MCP Registry (registry.modelcontextprotocol.io) 服务器搜索 API"
rate_limit:
  rpm: 60
  deadline_sec: 10.0
request:
  method: GET
  url: "https://registry.modelcontextprotocol.io/v0/servers"
  params:
    search: "{query}"
    limit: "{limit}"
response:
  items_path: "servers"
  url_template: "https://registry.modelcontextprotocol.io/v0/servers?search={id}"
  modality: "code"
  output_map:
    id: "server.name"
    title: "server.name"
    url: "server.websiteUrl || server.repository.url"
    snippet: "server.description | collapse_ws"
    popularity_unit: "'none'"
