id: codeberg
domain: code
tier: L0
protocol: http_json
description: "Codeberg (Gitea) 官方开源仓库搜索 API（可选 CODEBERG_TOKEN 提额）"
auth:
  env: CODEBERG_TOKEN
  required: false
  placement: "header:Authorization"
  prefix: "token "
rate_limit:
  rpm: 30
  deadline_sec: 10.0
request:
  method: GET
  url: "https://codeberg.org/api/v1/repos/search"
  params:
    q: "{query}"
    sort: "stars"
    order: "desc"
    limit: "{limit}"
response:
  items_path: "data"
  modality: "code"
  output_map:
    id: "id"
    title: "full_name"
    url: "html_url"
    snippet: "description | collapse_ws"
    published_at: "updated_at"
    popularity: "stars_count"
    popularity_unit: "'stars'"
